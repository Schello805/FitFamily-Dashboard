name: Release prüfen

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
      - run: tar --exclude=node_modules --exclude=.next --exclude=data -czf fitfamily-source-${{ github.ref_name }}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: fitfamily-source-${{ github.ref_name }}.tar.gz
